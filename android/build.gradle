buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        
        implementation(project(":react-native-gesture-handler"))
    implementation(project(":react-native-vector-icons"))
    implementation(project(":react-native-screens"))
    implementation(project(":react-native-svg"))
    implementation(project(":react-native-safe-area-context"))
    implementation(project(":react-native-image-picker"))
    implementation(project(":@react-native-async-storage/async-storage"))
    implementation(project(":@react-native-community/datetimepicker"))       
    implementation 'com.swmansion.gesturehandler:react-native-gesture-handler:2.10.0'  // Verifique a versão mais recente no npm
 
    }
}

apply plugin: "com.facebook.react.rootproject"
